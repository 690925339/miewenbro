<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>灭蚊先锋 (v5.5 - Final Fix)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        #hud {
            padding: 20px;
            color: white;
            text-shadow: 2px 2px 2px #000;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            color: #ffcc00;
        }

        p {
            margin: 5px 0;
            font-size: 16px;
        }

        #xp-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 20px;
            background: #333;
            border: 2px solid #555;
            border-radius: 10px;
            overflow: hidden;
        }

        #xp-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #adff2f);
            transition: width 0.2s;
        }

        #level-badge {
            position: absolute;
            bottom: 5px;
            left: -50px;
            width: 40px;
            height: 40px;
            background: #ffcc00;
            border-radius: 50%;
            color: #000;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            border: 2px solid #fff;
            box-shadow: 0 0 10px gold;
        }

        #top-info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        #time-display {
            font-size: 42px;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 10px #000;
            font-family: monospace;
        }

        #stage-display {
            font-size: 18px;
            color: #aaa;
            margin-top: 5px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #timer-label {
            font-size: 14px;
            color: #888;
            margin-bottom: -5px;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }

        .card-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #2a2a2a;
            color: white;
            width: 220px;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #444;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: #ffcc00;
            background: #333;
        }

        .card h3 {
            color: #ffcc00;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .card p {
            color: #ccc;
            font-size: 14px;
            margin: 0;
            line-height: 1.4;
        }

        .card .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        #gameover-overlay {
            background: rgba(50, 0, 0, 0.9);
            z-index: 20;
        }

        #victory-overlay {
            background: rgba(0, 50, 0, 0.9);
            z-index: 20;
        }

        button {
            padding: 12px 30px;
            font-size: 20px;
            margin-top: 20px;
            cursor: pointer;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 0 #aa0000;
            transition: transform 0.1s;
        }

        button:hover {
            background: #ff2222;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #aa0000;
        }

        .btn-victory {
            background: #44ff44;
            box-shadow: 0 4px 0 #00aa00;
            color: #004400;
            font-weight: bold;
        }

        .btn-victory:hover {
            background: #66ff66;
        }

        #start-screen {
            background: rgba(0, 0, 0, 0.8);
            z-index: 30;
            color: white;
            display: flex;
        }
    </style>
</head>

<body>

    <div id="ui-layer">
        <div id="top-info">
            <div id="timer-label">距离通关还剩</div>
            <div id="time-display">02:00</div>
            <div id="stage-display">STAGE 1: WARM UP</div>
        </div>
        <div id="hud">
            <div>
                <h1>🥔 灭蚊先锋</h1>
                <div class="stat-box">HP: <span id="hp-val">100</span> / <span id="max-hp-val">100</span></div>
            </div>
            <div class="stat-box" style="text-align: right;">
                <div>分数: <span id="score-val">0</span></div>
                <div style="font-size: 12px; color: #aaa;">击杀: <span id="kill-val">0</span></div>
            </div>
        </div>

        <div id="xp-container">
            <div id="xp-bar"></div>
            <div id="level-badge">1</div>
        </div>
    </div>

    <!-- Modals -->
    <div id="start-screen" class="overlay" style="display:flex;">
        <h1 style="font-size: 50px; color: #ffcc00; margin-bottom: 20px;">灭蚊先锋</h1>
        <p>坚持 <span style="color:#ffcc00; font-weight:bold;">2分钟</span> 即可通关</p>
        <p>第一关: 30秒 | 第二关: 30秒 | 第三关: 60秒</p>
        <button onclick="game.startInput()">开始挑战</button>
    </div>

    <div id="levelup-overlay" class="overlay">
        <h2 style="color: #ffcc00; font-size: 36px; margin-bottom: 10px;">升级了! (Lv <span id="new-level-val">2</span>)
        </h2>
        <div class="card-container" id="upgrade-cards"></div>
    </div>

    <div id="gameover-overlay" class="overlay">
        <h1 style="font-size: 48px; color: #ff5555;">失 败</h1>
        <p>你坚持了 <span id="final-time">0</span> 秒</p>
        <p>倒在第 <span id="final-stage">1</span> 关</p>
        <button onclick="location.reload()">再试一次</button>
    </div>

    <div id="victory-overlay" class="overlay">
        <h1 style="font-size: 64px; color: #00ff00; text-shadow: 0 0 20px #00ff00;">恭喜通关!</h1>
        <p style="font-size: 24px;">你战胜了蚊群！</p>
        <p>最终得分: <span id="vic-score">0</span></p>
        <button class="btn-victory" onclick="location.reload()">再玩一局</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Access
        const ui = {
            hp: document.getElementById('hp-val'),
            maxHp: document.getElementById('max-hp-val'),
            score: document.getElementById('score-val'),
            kills: document.getElementById('kill-val'),
            xpBar: document.getElementById('xp-bar'),
            lvlBadge: document.getElementById('level-badge'),
            levelup: document.getElementById('levelup-overlay'),
            cards: document.getElementById('upgrade-cards'),
            newLevel: document.getElementById('new-level-val'),
            gameover: document.getElementById('gameover-overlay'),
            victory: document.getElementById('victory-overlay'),
            finalTime: document.getElementById('final-time'),
            finalStage: document.getElementById('final-stage'),
            vicScore: document.getElementById('vic-score'),
            time: document.getElementById('time-display'),
            stage: document.getElementById('stage-display'),
            start: document.getElementById('start-screen')
        };

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
        }
        window.addEventListener('resize', resize);
        resize();

        const getWidth = () => canvas.width / (window.devicePixelRatio || 1);
        const getHeight = () => canvas.height / (window.devicePixelRatio || 1);

        const Rnd = {
            float: (min, max) => Math.random() * (max - min) + min,
            int: (min, max) => Math.floor(Math.random() * (max - min + 1)) + min,
            choice: (arr) => arr[Math.floor(Math.random() * arr.length)]
        };

        // --- Sound ---
        class SoundManager {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            play(type) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;

                if (type === 'shoot') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'shotgun') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
                    gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'hit') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(100, now);
                    gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now); osc.stop(now + 0.05);
                } else if (type === 'kill') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                    gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'levelup') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(800, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.5);
                    osc.start(now); osc.stop(now + 0.5);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(600, now + 0.2); osc.frequency.linearRampToValueAtTime(1000, now + 0.5);
                    gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 2);
                    osc.start(now); osc.stop(now + 2);
                }
            }
        }
        const sound = new SoundManager();

        // --- Entities ---
        class Particle {
            constructor(x, y, color, speed, size) {
                this.x = x; this.y = y; this.color = color;
                this.angle = Math.random() * Math.PI * 2; this.speed = Rnd.float(speed * 0.5, speed * 1.5);
                this.vx = Math.cos(this.angle) * this.speed; this.vy = Math.sin(this.angle) * this.speed;
                this.life = 1.0; this.decay = Rnd.float(0.03, 0.06); this.r = size;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; this.r *= 0.92; }
            draw(ctx) {
                ctx.globalAlpha = this.life; ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        class FloatingText {
            constructor(x, y, text, color) { this.x = x; this.y = y; this.text = text; this.color = color; this.life = 1.0; this.vy = -1; }
            update() { this.y += this.vy; this.life -= 0.02; }
            draw(ctx) { ctx.globalAlpha = this.life; ctx.fillStyle = this.color; ctx.font = "bold 16px sans-serif"; ctx.fillText(this.text, this.x, this.y); ctx.globalAlpha = 1.0; }
        }

        class XPOrb {
            constructor(x, y, value) { this.x = x; this.y = y; this.value = value; this.r = 6; this.magnetized = false; }
            update(player) {
                const dist = Math.hypot(player.x - this.x, player.y - this.y);
                if (dist < player.magnetRange) this.magnetized = true;
                if (this.magnetized) {
                    const angle = Math.atan2(player.y - this.y, player.x - this.x);
                    const speed = 10 + (200 - dist) * 0.15;
                    this.x += Math.cos(angle) * speed; this.y += Math.sin(angle) * speed;
                }
                return dist < player.contactRadius;
            }
            draw(ctx) { ctx.fillStyle = '#00ff00'; ctx.shadowBlur = 10; ctx.shadowColor = '#00ff00'; ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; }
        }

        class Bullet {
            constructor(x, y, angle, speed, dmg, duration, color = '#00ffff', pierce = 1) {
                this.x = x; this.y = y; this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.r = 5; this.damage = dmg; this.life = duration; this.color = color; this.active = true;
                this.pierce = pierce;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life--; if (this.life <= 0 || this.x < 0 || this.x > getWidth() || this.y < 0 || this.y > getHeight()) this.active = false; }
            draw(ctx) { ctx.fillStyle = this.color; ctx.shadowBlur = 5; ctx.shadowColor = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; }
        }

        class Enemy {
            constructor(game, type) {
                this.game = game; this.type = type;
                if (Math.random() < 0.5) { this.x = Math.random() < 0.5 ? -30 : getWidth() + 30; this.y = Math.random() * getHeight(); }
                else { this.x = Math.random() * getWidth(); this.y = Math.random() < 0.5 ? -30 : getHeight() + 30; }

                // FIXED: Default difficulty to 1 to avoid NaN if game.difficulty is undefined
                const diff = (game.difficulty === undefined || isNaN(game.difficulty)) ? 1 : game.difficulty;

                if (type === 'tank') {
                    this.hp = 80 + diff * 15; this.speed = 0.8; this.r = 22; this.damage = 15; this.color = '#aa0000'; this.xp = 40;
                } else if (type === 'swarm') {
                    this.hp = 2 + diff * 0.2; this.speed = 2.5 + Math.random(); this.r = 7; this.damage = 2; this.color = '#888'; this.xp = 2;
                } else {
                    // Normal: Super Nerf for One-Shot. GUARANTEED LOW HP.
                    this.hp = 5 + diff * 0.5; // Starts at 5, at 3 mins (diff~12) -> 11. Player base does 20.
                    this.speed = 1.5; this.r = 13; this.damage = 5; this.color = '#555'; this.xp = 8;
                }
                this.maxHp = this.hp; this.wingAngle = 0; this.hitFlash = 0;
            }
            update(player) {
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                let jitter = (this.type === 'swarm') ? Math.sin(Date.now() * 0.02) * 1.5 : (Math.random() - 0.5);
                this.game.enemies.forEach(other => { if (other !== this && Math.hypot(this.x - other.x, this.y - other.y) < this.r + other.r) { const pushA = Math.atan2(this.y - other.y, this.x - other.x); this.x += Math.cos(pushA); this.y += Math.sin(pushA); } }); // Soft collision
                this.x += Math.cos(angle) * this.speed + jitter; this.y += Math.sin(angle) * this.speed + jitter;
                this.wingAngle += (this.type === 'tank' ? 0.3 : 1.2); if (this.hitFlash > 0) this.hitFlash--;
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(Math.atan2(this.game.player.y - this.y, this.game.player.x - this.x));
                const fill = this.hitFlash > 0 ? '#fff' : this.color;
                ctx.fillStyle = fill;
                if (this.type === 'swarm') {
                    ctx.beginPath(); ctx.ellipse(0, 0, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.beginPath(); ctx.ellipse(0, -4, 4, 1.5, 0.2, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(0, 4, 4, 1.5, -0.2, 0, Math.PI * 2); ctx.fill();
                } else {
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    const wOff = Math.sin(this.wingAngle) * (this.type === 'tank' ? 12 : 8);
                    ctx.beginPath(); ctx.ellipse(-5, -8 + wOff, this.r * 0.8, this.r * 0.3, -0.2, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.ellipse(-5, 8 - wOff, this.r * 0.8, this.r * 0.3, 0.2, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(0, 0, this.r, this.r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(this.r * 0.4, -this.r * 0.3, this.r * 0.2, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(this.r * 0.4, this.r * 0.3, this.r * 0.2, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }
            takeDamage(amt) { this.hp -= amt; this.hitFlash = 3; if (this.hp > 0) sound.play('hit'); }
        }

        class Player {
            constructor() {
                this.x = getWidth() / 2; this.y = getHeight() / 2; this.r = 25; this.speed = 4.5;
                this.maxHp = 100; this.hp = 100; this.dmgMult = 1.0; this.magnetRange = 150;

                this.weapons = {
                    gun: { level: 1, cooldown: 0, maxCd: 25 },
                    shotgun: { level: 0, cooldown: 0, maxCd: 60 },
                    aura: { level: 0, tick: 0, radius: 80 },
                    swatter: { level: 0, cooldown: 0, maxCd: 40 },
                    laser: { level: 0, cooldown: 0, maxCd: 50 }
                };

                this.heldWeapon = 'gun';

                this.contactRadius = this.r + 10; this.level = 1; this.xp = 0; this.xpToNext = 100;
                this.facing = 1; this.moving = false; this.weaponTip = { x: 0, y: 0 };
            }

            update(input) {
                let dx = 0, dy = 0; if (input.w) dy -= 1; if (input.s) dy += 1; if (input.a) dx -= 1; if (input.d) dx += 1;
                this.moving = (dx !== 0 || dy !== 0);
                if (this.moving) {
                    const len = Math.hypot(dx, dy); this.x += (dx / len) * this.speed; this.y += (dy / len) * this.speed;
                    if (dx !== 0) this.facing = Math.sign(dx);
                }
                this.x = Math.max(this.r, Math.min(getWidth() - this.r, this.x)); this.y = Math.max(this.r, Math.min(getHeight() - this.r, this.y));

                // Muzzle Offset Calculation (Dynamic per weapon)
                let muzzleOffset = 30; // Default Gun
                let muzzleY = -5; // Chest height

                if (this.heldWeapon === 'shotgun') { muzzleOffset = 45; muzzleY = -8; }
                else if (this.heldWeapon === 'laser') { muzzleOffset = 42; muzzleY = -5; }
                else if (this.heldWeapon === 'swatter') { muzzleOffset = 10; muzzleY = 0; }

                this.weaponTip.x = this.x + (muzzleOffset * this.facing);
                this.weaponTip.y = this.y + muzzleY;

                // Attack logic
                const target = game.getNearestEnemy();

                // 1. Gun
                if (this.weapons.gun.level > 0) {
                    if (this.weapons.gun.cooldown > 0) this.weapons.gun.cooldown--; else if (target) {
                        const count = 1 + Math.floor(this.weapons.gun.level / 3);
                        for (let i = 0; i < count; i++) setTimeout(() => { if (target) this.shootGun(target); }, i * 100);
                        this.weapons.gun.cooldown = Math.max(5, this.weapons.gun.maxCd - this.weapons.gun.level * 2);
                    }
                }
                // 2. Shotgun
                if (this.weapons.shotgun.level > 0) {
                    if (this.weapons.shotgun.cooldown > 0) this.weapons.shotgun.cooldown--; else if (target) {
                        this.shootShotgun(target); this.weapons.shotgun.cooldown = Math.max(30, this.weapons.shotgun.maxCd - this.weapons.shotgun.level * 3);
                    }
                }
                // 3. Aura
                if (this.weapons.aura.level > 0) {
                    this.weapons.aura.tick++;
                    if (this.weapons.aura.tick % 20 === 0) {
                        let hit = false;
                        game.enemies.forEach(e => {
                            if (Math.hypot(e.x - this.x, e.y - this.y) < this.weapons.aura.radius + (this.weapons.aura.level * 10)) {
                                e.takeDamage((2 + this.weapons.aura.level * 2) * this.dmgMult); game.spawnText(e.x, e.y - 10, Math.floor(2 + this.weapons.aura.level * 2), '#ff00ff'); hit = true;
                            }
                        });
                        if (hit) sound.play('hit');
                    }
                }
                // 4. Swatter (Melee)
                if (this.weapons.swatter.level > 0) {
                    if (this.weapons.swatter.cooldown > 0) this.weapons.swatter.cooldown--;
                    else {
                        let enemiesNearby = false;
                        const range = 80 + this.weapons.swatter.level * 10;
                        for (let e of game.enemies) { if (Math.hypot(e.x - this.x, e.y - this.y) < range) { enemiesNearby = true; break; } }

                        if (enemiesNearby) {
                            sound.play('shoot');
                            const arcAngle = this.facing > 0 ? 0 : Math.PI;
                            for (let i = 0; i < 5; i++) {
                                const a = arcAngle + Rnd.float(-1, 1);
                                game.particles.push(new Particle(this.x + Math.cos(a) * 30, this.y + Math.sin(a) * 30, '#55aaff', 5, 4));
                            }
                            game.enemies.forEach(e => {
                                const d = Math.hypot(e.x - this.x, e.y - this.y);
                                const dx = e.x - this.x;
                                if (d < range && Math.sign(dx) === this.facing) {
                                    e.takeDamage(25 * this.dmgMult * (1 + this.weapons.swatter.level * 0.5));
                                    game.spawnText(e.x, e.y - 20, "ZAP!", '#00ffff');
                                    e.x += this.facing * 20;
                                }
                            });
                            this.weapons.swatter.cooldown = Math.max(20, this.weapons.swatter.maxCd - this.weapons.swatter.level * 2);
                        }
                    }
                }
                // 5. Laser (Piercing)
                if (this.weapons.laser.level > 0) {
                    if (this.weapons.laser.cooldown > 0) this.weapons.laser.cooldown--;
                    else if (target) {
                        sound.play('shoot');
                        const angle = Math.atan2(target.y - this.weaponTip.y, target.x - this.weaponTip.x);
                        game.bullets.push(new Bullet(this.weaponTip.x, this.weaponTip.y, angle, 15, 15 * this.dmgMult * (1 + this.weapons.laser.level), 30, '#00ff00', 999));
                        this.weapons.laser.cooldown = Math.max(30, this.weapons.laser.maxCd - this.weapons.laser.level * 5);
                    }
                }
            }

            shootGun(target) {
                sound.play('shoot'); const angle = Math.atan2(target.y - this.weaponTip.y, target.x - this.weaponTip.x);
                game.bullets.push(new Bullet(this.weaponTip.x, this.weaponTip.y, angle + Rnd.float(-0.05, 0.05), 10, 20 * this.dmgMult * (1 + this.weapons.gun.level * 0.2), 60, '#00ffff', 1));
            }
            shootShotgun(target) {
                sound.play('shotgun'); const angle = Math.atan2(target.y - this.weaponTip.y, target.x - this.weaponTip.x);
                const pellets = 3 + this.weapons.shotgun.level;
                for (let i = 0; i < pellets; i++) game.bullets.push(new Bullet(this.weaponTip.x, this.weaponTip.y, angle + Rnd.float(-0.4, 0.4), Rnd.float(8, 12), 10 * this.dmgMult * (1 + this.weapons.shotgun.level * 0.2), 40, '#ffaa00', 1));
            }
            gainXp(amount) { this.xp += amount; if (this.xp >= this.xpToNext) { this.xp -= this.xpToNext; this.level++; this.xpToNext = Math.floor(this.xpToNext * 1.2); game.triggerLevelUp(); } game.updateUi(); }

            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y); const walkCycle = this.moving ? Math.sin(Date.now() * 0.015) : 0; const breath = Math.sin(Date.now() * 0.005) * 1.5; ctx.scale(this.facing, 1);

                // Aura
                if (this.weapons.aura.level > 0) { const r = this.weapons.aura.radius + (this.weapons.aura.level * 10); ctx.save(); ctx.globalAlpha = 0.15 + Math.sin(Date.now() * 0.008) * 0.05; const g = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r); g.addColorStop(0, 'rgba(0,255,255,0)'); g.addColorStop(1, 'rgba(0,255,255,0.8)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0, 28, 18, 6, 0, 0, Math.PI * 2); ctx.fill();

                // Legs
                const legOffset = walkCycle * 8;
                const drawLeg = (x, c, o) => { ctx.save(); ctx.translate(x, 10); ctx.rotate(o * 0.15); ctx.fillStyle = '#335599'; ctx.fillRect(-6, 0, 12, 12); ctx.fillStyle = '#ffccaa'; ctx.fillRect(-4, 12, 8, 10); ctx.fillStyle = '#222'; ctx.fillRect(-5, 22, 12, 4); ctx.fillStyle = '#f00'; ctx.fillRect(2, 20, 2, 4); ctx.restore(); };
                drawLeg(6, '#ffccaa', -legOffset); drawLeg(-6, '#ffccaa', legOffset);

                // Torso
                ctx.save(); ctx.translate(0, breath); ctx.fillStyle = '#f0f0f0'; ctx.beginPath(); ctx.roundRect(-14, -20, 28, 36, 6); ctx.fill(); ctx.fillStyle = '#eebb99'; ctx.beginPath(); ctx.ellipse(0, -20, 8, 5, 0, 0, Math.PI * 2); ctx.fill();

                // Head
                ctx.save(); ctx.translate(0, -24); const hg = ctx.createRadialGradient(-5, -5, 2, 0, 0, 16); hg.addColorStop(0, '#ffeebb'); hg.addColorStop(1, '#eebb99'); ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 2; ctx.strokeStyle = '#444'; ctx.beginPath(); ctx.moveTo(6, -4); ctx.lineTo(12, -2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-6, -4); ctx.lineTo(-12, -2); ctx.stroke();
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(8, 0, 2, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-4, 0, 2, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#cccccc'; ctx.beginPath(); ctx.arc(0, 8, 7, 0, Math.PI); ctx.fill(); ctx.restore();

                // Arms
                ctx.fillStyle = '#eebb99'; ctx.save(); ctx.translate(-12, -10); ctx.rotate(0.5 + walkCycle * 0.05); ctx.fillRect(-4, 0, 8, 18); ctx.restore();
                ctx.save(); ctx.translate(12, -12); ctx.rotate(-0.5 + breath * 0.1); ctx.fillStyle = '#eebb99'; ctx.fillRect(-4, 0, 8, 14); ctx.translate(0, 14); ctx.rotate(-1.0); ctx.fillRect(-3, 0, 6, 12);

                // --- DYNAMIC WEAPON VISUALS ---
                ctx.translate(0, 10);
                if (this.heldWeapon === 'shotgun') {
                    ctx.rotate(1.5);
                    ctx.fillStyle = '#111'; ctx.fillRect(-5, -8, 24, 12);
                    ctx.fillStyle = '#444'; ctx.fillRect(19, -8, 4, 12);
                    ctx.fillStyle = '#532'; ctx.fillRect(-8, -4, 10, 8);
                } else if (this.heldWeapon === 'swatter') {
                    ctx.rotate(0.5);
                    ctx.fillStyle = '#222'; ctx.fillRect(-2, -5, 4, 15);
                    ctx.translate(0, 10);
                    ctx.strokeStyle = '#55aaff'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.ellipse(0, 10, 10, 14, 0, 0, Math.PI * 2); ctx.stroke();
                    ctx.fillStyle = 'rgba(0,100,255,0.2)'; ctx.fill();
                    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 24); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-8, 10); ctx.lineTo(8, 10); ctx.stroke();
                } else if (this.heldWeapon === 'laser') {
                    ctx.rotate(1.5);
                    ctx.fillStyle = '#ccc'; ctx.fillRect(-5, -5, 20, 8);
                    ctx.fillStyle = '#0f0'; ctx.fillRect(5, -2, 12, 2);
                    ctx.fillStyle = '#555'; ctx.fillRect(0, 5, 6, 6);
                } else {
                    ctx.rotate(1.5);
                    ctx.fillStyle = '#cc3333'; ctx.fillRect(-5, -5, 20, 10);
                    ctx.fillStyle = '#fff'; ctx.fillRect(0, -3, 10, 6);
                    ctx.fillStyle = '#fac'; ctx.fillRect(15, -2, 5, 4);
                    ctx.fillStyle = '#555'; ctx.fillRect(0, 5, 8, 6);
                }
                ctx.restore();

                ctx.restore(); ctx.restore();
                ctx.fillStyle = 'rgba(50,0,0,0.6)'; ctx.fillRect(this.x - 20, this.y - 60, 40, 6); const hpPct = Math.max(0, this.hp / this.maxHp); ctx.fillStyle = hpPct > 0.5 ? '#00ff00' : (hpPct > 0.2 ? '#ffff00' : '#ff0000'); ctx.fillRect(this.x - 20, this.y - 60, 40 * hpPct, 6); ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(this.x - 20, this.y - 60, 40, 6);
            }
        }

        class Game {
            constructor() {
                this.state = 'MENU';
                this.player = new Player();
                this.enemies = []; this.bullets = []; this.particles = []; this.orbs = []; this.texts = [];
                this.keys = { w: false, a: false, s: false, d: false };
                this.frame = 0; this.score = 0; this.kills = 0;
                this.gameTime = 0;
                this.maxTime = 120; // FIXED: 2 Minutes Total
                this.difficulty = 0;

                this.stageConfig = [
                    { name: "第一关: 暖身 (30秒)", maxEnemies: 50, spawnRate: 25 },
                    { name: "第二关: 进阶 (30秒)", maxEnemies: 150, spawnRate: 10 },
                    { name: "第三关: 决战 (60秒)", maxEnemies: 500, spawnRate: 3 }
                ];
                this.currentStage = 0;
                this.bindInput();
            }

            startInput() { ui.start.style.display = 'none'; sound.init(); this.start(); }
            start() { this.state = 'PLAYING'; this.loop(); }
            bindInput() { window.addEventListener('keydown', e => this.handleKey(e, true)); window.addEventListener('keyup', e => this.handleKey(e, false)); }
            handleKey(e, p) { const k = e.key.toLowerCase(); if (this.keys.hasOwnProperty(k)) this.keys[k] = p; if (e.key.startsWith('Arrow')) { if (e.key.includes('Up')) this.keys.w = p; if (e.key.includes('Down')) this.keys.s = p; if (e.key.includes('Left')) this.keys.a = p; if (e.key.includes('Right')) this.keys.d = p; } }

            spawnParticles(x, y, c, n) { for (let i = 0; i < n; i++) this.particles.push(new Particle(x, y, c, 3, 3)); }
            spawnText(x, y, t, c = '#fff') { this.texts.push(new FloatingText(x, y, t, c)); }
            getNearestEnemy() { let n = null, min = 600; for (let e of this.enemies) { const d = Math.hypot(e.x - this.player.x, e.y - this.player.y); if (d < min) { min = d; n = e; } } return n; }

            triggerLevelUp() {
                sound.play('levelup'); this.state = 'LEVELUP'; ui.levelup.style.display = 'flex'; ui.newLevel.innerText = this.player.level;
                const w = this.player.weapons;

                const possibleUpgrades = [
                    {
                        name: '强化喷雾', desc: `Lv ${w.gun.level + 1} 提升射速`, icon: '🔫',
                        apply: () => { w.gun.level++; this.player.heldWeapon = 'gun'; }
                    },
                    {
                        name: '散弹轰炸', desc: w.shotgun.level === 0 ? '解锁散弹' : `Lv ${w.shotgun.level + 1} 增加弹丸`, icon: '💥',
                        apply: () => { w.shotgun.level++; this.player.heldWeapon = 'shotgun'; }
                    },
                    {
                        name: '高压电圈', desc: w.aura.level === 0 ? '解锁电圈' : `Lv ${w.aura.level + 1} 扩大范围`, icon: '⚡',
                        apply: () => { w.aura.level++; }
                    },
                    {
                        name: '电蚊拍', desc: w.swatter.level === 0 ? '解锁电蚊拍' : `Lv ${w.swatter.level + 1} 扩大范围`, icon: '🏸',
                        apply: () => { w.swatter.level++; this.player.heldWeapon = 'swatter'; }
                    },
                    {
                        name: '激光指某人', desc: w.laser.level === 0 ? '解锁激光笔' : `Lv ${w.laser.level + 1} 提升伤害`, icon: '🔦',
                        apply: () => { w.laser.level++; this.player.heldWeapon = 'laser'; }
                    },
                    { name: '急救包', desc: '满血 + 提升上限', icon: '❤️', apply: () => { this.player.maxHp += 50; this.player.hp = this.player.maxHp; } },
                    { name: '强力磁铁', desc: '范围 +50%', icon: '🧲', apply: () => this.player.magnetRange *= 1.5 },
                    { name: '飞毛腿', desc: '移速 +15%', icon: '👟', apply: () => this.player.speed *= 1.15 }
                ];
                ui.cards.innerHTML = '';
                possibleUpgrades.sort(() => 0.5 - Math.random()).slice(0, 3).forEach(opt => {
                    const c = document.createElement('div'); c.className = 'card'; c.innerHTML = `<div class="icon">${opt.icon}</div><h3>${opt.name}</h3><p>${opt.desc}</p>`;
                    c.onclick = () => { opt.apply(); this.resumeGame(); };
                    ui.cards.appendChild(c);
                });
            }

            resumeGame() { ui.levelup.style.display = 'none'; this.state = 'PLAYING'; this.updateUi(); }
            gameOver() { this.state = 'GAMEOVER'; ui.gameover.style.display = 'flex'; ui.finalTime.innerText = this.gameTime; ui.finalStage.innerText = this.currentStage + 1; }
            victory() { this.state = 'VICTORY'; sound.play('win'); ui.victory.style.display = 'flex'; ui.vicScore.innerText = Math.floor(this.score); }

            updateUi() {
                ui.hp.innerText = Math.floor(this.player.hp); ui.maxHp.innerText = Math.floor(this.player.maxHp);
                ui.score.innerText = Math.floor(this.score); ui.kills.innerText = this.kills;
                ui.lvlBadge.innerText = this.player.level; ui.xpBar.style.width = `${(this.player.xp / this.player.xpToNext) * 100}%`;

                const remaining = Math.max(0, this.maxTime - this.gameTime);
                const m = Math.floor(remaining / 60).toString().padStart(2, '0');
                const s = Math.floor(remaining % 60).toString().padStart(2, '0');
                ui.time.innerText = `${m}:${s}`;
                ui.time.style.color = remaining < 60 ? '#ff0000' : '#fff';
                ui.stage.innerText = this.stageConfig[this.currentStage].name;
                ui.stage.style.color = this.currentStage === 2 ? '#ff4444' : '#aaa';
            }

            spawnLogic() {
                if (this.gameTime < 30) this.currentStage = 0; else if (this.gameTime < 60) this.currentStage = 1; else this.currentStage = 2;
                const cfg = this.stageConfig[this.currentStage];
                if (this.enemies.length >= cfg.maxEnemies) return;
                let rate = cfg.spawnRate;
                if (this.currentStage === 2) { rate = Math.max(1, 4 - (this.gameTime - 60) * 0.1); }

                if (this.frame % Math.floor(rate) === 0) {
                    let type = 'normal'; const dice = Math.random();
                    if (this.currentStage === 0) { type = 'normal'; }
                    else if (this.currentStage === 1) { if (dice < 0.2) type = 'swarm'; }
                    else { if (dice < 0.15) type = 'tank'; else if (dice < 0.6) type = 'swarm'; else type = 'normal'; }

                    if (type === 'swarm') { const size = this.currentStage === 2 ? 8 : 4; for (let i = 0; i < size; i++) this.enemies.push(new Enemy(this, 'swarm')); }
                    else { this.enemies.push(new Enemy(this, type)); if (this.currentStage === 2 && Math.random() < 0.5) this.enemies.push(new Enemy(this, type)); }
                }
            }

            loop() {
                if (this.state === 'PLAYING') {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.strokeStyle = '#222'; ctx.beginPath(); for (let i = 0; i < canvas.width; i += 60) { ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); } for (let i = 0; i < canvas.height; i += 60) { ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); } ctx.stroke();

                    this.frame++;
                    if (this.frame % 60 === 0) {
                        this.gameTime++;
                        this.difficulty = this.gameTime / 15; // FIXED: Update difficulty every second
                        if (this.gameTime >= this.maxTime) { this.victory(); return; }
                        this.updateUi();
                    }

                    this.spawnLogic();
                    this.player.update(this.keys);

                    // FIXED Bullets Collision LOGIC
                    for (let i = this.bullets.length - 1; i >= 0; i--) {
                        let b = this.bullets[i]; b.update();
                        if (!b.active) { this.bullets.splice(i, 1); continue; }

                        for (let j = this.enemies.length - 1; j >= 0; j--) {
                            let e = this.enemies[j];
                            if (Math.hypot(b.x - e.x, b.y - e.y) < b.r + e.r) {
                                e.takeDamage(b.damage);
                                game.spawnText(e.x, e.y - 10, Math.floor(b.damage), b.color);

                                b.pierce--; // Reduce pierce count
                                if (b.pierce <= 0) b.active = false;

                                if (e.hp <= 0) { sound.play('kill'); game.spawnParticles(e.x, e.y, e.color, 8); game.orbs.push(new XPOrb(e.x, e.y, e.xp)); game.enemies.splice(j, 1); game.score += e.xp * 10; game.kills++; game.updateUi(); }
                                if (!b.active) break; // Break loop if bullet died
                            }
                        }
                    }
                    // Enemy Collision & Update
                    for (let i = this.enemies.length - 1; i >= 0; i--) {
                        let e = this.enemies[i]; e.update(this.player);
                        if (Math.hypot(e.x - game.player.x, e.y - game.player.y) < e.r + game.player.r) { game.player.hp -= 0.5; if (game.player.hp <= 0) game.gameOver(); game.updateUi(); }
                    }
                    // XP Orbs
                    for (let i = this.orbs.length - 1; i >= 0; i--) { if (this.orbs[i].update(this.player)) { game.player.gainXp(this.orbs[i].value); this.orbs.splice(i, 1); } }
                    // Particles & Text
                    this.texts.forEach((t, i) => { t.update(); if (t.life <= 0) this.texts.splice(i, 1); });
                    this.particles.forEach((p, i) => { p.update(); if (p.life <= 0) this.particles.splice(i, 1); });

                    // Draw
                    this.orbs.forEach(o => o.draw(ctx)); this.enemies.forEach(e => e.draw(ctx)); this.player.draw(ctx); this.bullets.forEach(b => b.draw(ctx)); this.particles.forEach(p => p.draw(ctx)); this.texts.forEach(t => t.draw(ctx));
                }
                requestAnimationFrame(() => this.loop());
            }
        }

        const game = new Game();
    </script>
